name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build_release:
    name: Build + publish .pbiviz (GitHub Release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Install Power BI visuals tools
        run: npm install -g powerbi-visuals-tools

      - name: Build pbiviz package
        run: pbiviz package

      - name: Rename artifact to include tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          FILE=$(ls dist/*.pbiviz | head -n 1)
          cp "$FILE" "dist/ggpbi-${TAG}.pbiviz"

      - name: Create GitHub Release + upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ggpbi-${{ github.ref_name }}.pbiviz
          generate_release_notes: true
