name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  pbiviz:
    name: Build .pbiviz (PR artifact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Power BI visuals tools
        run: npm install -g powerbi-visuals-tools
      - name: Build pbiviz package
        run: pbiviz package
      - name: Upload pbiviz artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggpbi-pbiviz-${{ github.sha }}
          path: dist/*.pbiviz
          if-no-files-found: error
